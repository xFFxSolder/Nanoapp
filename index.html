<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Banana 2: Church Media Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #8b5cf6; /* Vibrant Purple */
            --primary-hover: #7c3aed;
            --secondary: #3b82f6; /* Glowing Blue */
            --bg: #09090b; /* Zinc 950 - deeper dark */
            --surface: rgba(24, 24, 27, 0.7); /* Zinc 900 semi-transparent */
            --surface-hover: rgba(39, 39, 42, 0.9); /* Zinc 800 */
            --surface-active: rgba(63, 63, 70, 0.9); /* Zinc 700 */
            --text-main: #fafafa; /* Zinc 50 */
            --text-muted: #a1a1aa; /* Zinc 400 */
            --border: rgba(63, 63, 70, 0.5); /* Zinc 700 */
            --radius: 16px;
            --sidebar-width: 320px;

            /* Neon Tag Accents */
            --tag-glow: rgba(139, 92, 246, 0.2);
            --tag-text: #c4b5fd;

            --glow-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            box-shadow: var(--glass-shadow);
        }

        /* Top Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #c4b5fd, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Main Dashboard Layout */
        .dashboard {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            padding-bottom: 110px; /* Space for sticky footer */
        }

        /* Left Sidebar: Categories Menu */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 1.5rem 1rem;
            gap: 0.5rem;
        }

        /* Hide scrollbar for sidebar */
        .sidebar::-webkit-scrollbar { width: 0px; }

        .category-nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
            border: 1px solid transparent;
            font-weight: 500;
        }

        .category-nav-item:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .category-nav-item.active {
            background: var(--surface-active);
            color: var(--text-main);
            border-color: var(--border);
            box-shadow: inset 2px 0 0 var(--primary);
        }

        .category-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .category-icon {
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
        }

        .badge {
            background: var(--primary);
            color: white;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 99px;
            font-weight: 700;
            display: none; /* Hidden by default, shown via JS when count > 0 */
        }

        .badge.visible {
            display: inline-block;
        }

        /* Main Content Area (Right Side) */
        .workspace {
            flex: 1;
            padding: 2rem 3rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Base Subject Input Panel */
        .subject-panel {
            border-radius: var(--radius);
            padding: 1.5rem;
        }

        .subject-panel h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .subject-panel p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: rgba(9, 9, 11, 0.5); /* Darker input */
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        /* Dynamic Category View Panel */
        .tags-view-panel {
            flex: 1;
        }

        .tags-header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .tags-header h2 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .tag {
            padding: 0.6rem 1.2rem;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            background-color: rgba(24, 24, 27, 0.4);
            color: var(--text-muted);
            backdrop-filter: blur(4px);
        }

        .tag:hover {
            transform: translateY(-2px);
            color: var(--text-main);
            border-color: var(--text-muted);
            background-color: var(--surface-hover);
        }

        .tag:active {
            transform: translateY(0);
        }

        .tag.active {
            background-color: var(--tag-glow);
            color: var(--tag-text);
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--tag-glow);
        }

        /* Sticky Footer */
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 1rem 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-sizing: border-box;
        }

        .footer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-header h3 {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
        }

        .output-box {
            background-color: rgba(9, 9, 11, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            font-size: 1.05rem;
            min-height: 24px;
            max-height: 80px;
            overflow-y: auto;
            word-wrap: break-word;
            line-height: 1.5;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            filter: brightness(1.1);
            box-shadow: var(--glow-shadow);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--surface-hover);
            border-color: var(--text-muted);
            box-shadow: none;
        }

        .btn-magic {
            background: linear-gradient(135deg, #f59e0b, #ef4444); /* Orange/Red gradient */
        }

        /* Responsive */
        @media (max-width: 900px) {
            .dashboard {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: 100%;
                height: 200px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .workspace {
                padding: 1.5rem;
            }
        }

        /* Icons (SVG injected via JS for neatness, but CSS styles here) */
        svg {
            display: block;
        }
    </style>
</head>
<body>

    <header class="glass">
        <h1>Nano Banana 2: Church Media Edition</h1>
        <div style="color: var(--text-muted); font-size: 0.9rem;">Sermon Title & Church Graphics Builder</div>
    </header>

    <div class="dashboard">

        <!-- Left Sidebar Navigation -->
        <aside class="sidebar glass" id="sidebar-nav">
            <!-- Navigation items injected via JS -->
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">

            <div class="subject-panel glass">
                <h2>1. Core Concept / Subject</h2>
                <p>Describe your main subject, action, and setting here.</p>
                <textarea id="base-prompt" placeholder="A futuristic city with flying cars, a cyberpunk samurai standing in the rain..."></textarea>
            </div>

            <div class="tags-view-panel" id="tags-view-panel">
                <div class="tags-header">
                    <h2 id="current-category-title">
                        <!-- Icon and Title injected here -->
                        Select a category from the left
                    </h2>
                </div>
                <div class="tags-container" id="tags-container">
                    <!-- Tags for active category injected here -->
                </div>
            </div>

        </main>
    </div>

    <!-- Sticky Footer -->
    <footer class="sticky-footer glass">
        <div class="footer-header">
            <h3>Final Prompt Output</h3>
            <div class="actions">
                <button class="btn btn-magic" id="btn-random">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    Surprise Me
                </button>
                <button class="btn btn-outline" id="btn-clear">Clear All</button>
                <button class="btn" id="btn-copy">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy
                </button>
            </div>
        </div>
        <div class="output-box" id="final-output">Your generated prompt will dynamically appear here...</div>
    </footer>

    <script>
        // Expanded "Pro" Library Data with Icons and New Categories
        const libraryData = [
            {
                id: "media_type",
                title: "Media Type",
                icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>',
                tags: ["Sermon title graphic", "Worship lyric background", "Event flyer", "Social media post", "Church bulletin cover", "Announcement slide", "YouTube thumbnail", "Instagram story", "Sermon bumper video still", "Podcast cover art"]
            },
            {
                id: "seasons_holidays",
                title: "Seasons & Holidays",
                icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>',
                tags: ["Easter Sunday", "Good Friday", "Christmas Eve service", "Advent season", "Lent", "Palm Sunday", "Pentecost", "Mother's Day", "Father's Day", "Fall festival", "VBS theme", "Baptism Sunday", "Communion service", "Ash Wednesday", "Back to school"]
            },
            {
                id: "stage_lighting",
                title: "Stage & Lighting",
                icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>',
                tags: ["Moving head lights", "Atmospheric haze", "LED screen pixels", "Dynamic beam lights", "Volumetric lighting", "Laser light show", "Warm tungsten glow", "Cinematic stage lighting", "Washed stage lighting", "Strobe lights", "Soft box lighting", "Backlit silhouette", "Lens flare", "Fog machine smoke"]
            },
            {
                id: "subjects_people",
                title: "Subjects & People",
                icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>',
                tags: ["Worship leader", "Pastor preaching", "Congregation raising hands", "Choir singing", "Worship band", "Drummer on stage", "Guitarist playing", "Silhouetted figure", "Praying hands", "People gathering", "Youth ministry group", "Kids ministry", "Baptism moment", "Communion elements", "Open Bible", "Empty tomb", "Glowing cross", "Crown of thorns"]
            },
            {
                id: "atmosphere_vibe",
                title: "Atmosphere & Vibe",
                icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19c2.485 0 4.5-2.015 4.5-4.5S19.985 10 17.5 10H16a7.5 7.5 0 1 0-14.46 2.53"></path></svg>',
                tags: ["Reverent", "Energetic youth night", "Contemplative", "Modern megachurch", "Traditional church", "Joyful atmosphere", "Heavenly glow", "Melancholic vibe", "Ethereal", "Cinematic aesthetic", "Minimalist sanctuary", "Rustic barn venue", "Industrial warehouse venue", "High-tech auditorium", "Passion Conference aesthetic", "Hillsong worship style", "Elevation worship background"]
            },
            {
                id: "typography_integration",
                title: "Typography Integration",
                icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>',
                tags: ["Bold sans-serif title", "Elegant serif text", "Negative space for text", "Center focal point", "Left aligned composition", "Right aligned composition", "Modern worship typography", "Distressed youth font", "Neon tube lettering", "3D metallic text", "Minimalist layout", "Integrated into environment", "Thick block letters", "Handwritten script", "Grunge stencil"]
            },
            {
                id: "colors_tones",
                title: "Colors & Tones",
                icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>',
                tags: ["Dark and moody center", "Vibrant colors", "Monochromatic", "Duotone", "Pastel tones", "High contrast", "Desaturated", "Warm golden hour", "Cinematic teal and orange", "Earthy tones", "Neon synthwave", "Muted autumn colors", "Sepia", "Iridescent", "Gothic darkness"]
            }
        ];

        // Smart Suggestions Data (Tag to Array of suggested Tags)
        const tagPairings = {
            "Sermon title graphic": ["Negative space for text", "Center focal point", "Bold sans-serif title", "Dark and moody center", "Minimalist layout"],
            "Worship lyric background": ["Atmospheric haze", "Washed stage lighting", "Dark and moody center", "Moving head lights", "Negative space for text"],
            "Event flyer": ["Vibrant colors", "High contrast", "Thick block letters", "Joyful atmosphere"],
            "Easter Sunday": ["Empty tomb", "Glowing cross", "Warm golden hour", "Joyful atmosphere", "Pastel tones", "Heavenly glow"],
            "Good Friday": ["Crown of thorns", "Dark and moody center", "High contrast", "Melancholic vibe", "Gothic darkness"],
            "Christmas Eve service": ["Warm tungsten glow", "Candlelight", "Reverent", "Elegant serif text"],
            "Youth ministry group": ["Energetic youth night", "Distressed youth font", "Neon tube lettering", "Laser light show", "Vibrant colors", "Industrial warehouse venue"],
            "Worship band": ["Dynamic beam lights", "Volumetric lighting", "Cinematic stage lighting", "Moving head lights"],
            "Pastor preaching": ["Open Bible", "Warm tungsten glow", "Center focal point", "Reverent"],
            "Modern megachurch": ["LED screen pixels", "Moving head lights", "Atmospheric haze", "High-tech auditorium"],
            "Hillsong worship style": ["Cinematic aesthetic", "Washed stage lighting", "Modern worship typography", "Atmospheric haze", "Lens flare"],
            "Elevation worship background": ["LED screen pixels", "Monochromatic", "Volumetric lighting", "Minimalist layout"]
        };

        // State Tracking
        const selectedTags = {};
        libraryData.forEach(cat => selectedTags[cat.id] = new Set());
        // Add pseudo-category for suggestions
        selectedTags["suggested"] = new Set();
        let activeCategoryId = "suggested"; // Default to suggestions category

        // Derived state for suggestions
        let availableSuggestions = [];

        // DOM Elements
        const sidebarNav = document.getElementById("sidebar-nav");
        const basePromptInput = document.getElementById("base-prompt");
        const finalOutput = document.getElementById("final-output");
        const tagsContainer = document.getElementById("tags-container");
        const currentCategoryTitle = document.getElementById("current-category-title");

        const btnCopy = document.getElementById("btn-copy");
        const btnClear = document.getElementById("btn-clear");
        const btnRandom = document.getElementById("btn-random");

        // Initialization
        function initApp() {
            renderSidebar();
            renderActiveCategory(activeCategoryId);
            updatePrompt();
        }

        // Render Sidebar Navigation
        function renderSidebar() {
            sidebarNav.innerHTML = ""; // Clear existing

            // Add Smart Suggestions pseudo-category first
            const suggestionNavItem = document.createElement("div");
            suggestionNavItem.className = `category-nav-item ${'suggested' === activeCategoryId ? 'active' : ''}`;
            suggestionNavItem.dataset.id = "suggested";

            const sugInfoWrapper = document.createElement("div");
            sugInfoWrapper.className = "category-info";

            const sugIconSpan = document.createElement("span");
            sugIconSpan.className = "category-icon";
            sugIconSpan.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path><circle cx="12" cy="12" r="4"></circle></svg>';
            sugIconSpan.style.color = "var(--primary)"; // Special color for suggestions

            const sugTitleSpan = document.createElement("span");
            sugTitleSpan.textContent = "Smart Suggestions";
            sugTitleSpan.style.color = "var(--primary)"; // Special color

            sugInfoWrapper.appendChild(sugIconSpan);
            sugInfoWrapper.appendChild(sugTitleSpan);

            const sugBadge = document.createElement("span");
            sugBadge.className = "badge";
            sugBadge.id = "badge-suggested";
            sugBadge.textContent = availableSuggestions.length;
            if (availableSuggestions.length > 0) sugBadge.classList.add('visible');

            suggestionNavItem.appendChild(sugInfoWrapper);
            suggestionNavItem.appendChild(sugBadge);

            suggestionNavItem.addEventListener("click", () => {
                document.querySelectorAll('.category-nav-item').forEach(el => el.classList.remove('active'));
                suggestionNavItem.classList.add('active');
                activeCategoryId = "suggested";
                renderActiveCategory("suggested");
            });

            sidebarNav.appendChild(suggestionNavItem);

            // Render normal categories
            libraryData.forEach(category => {
                const navItem = document.createElement("div");
                navItem.className = `category-nav-item ${category.id === activeCategoryId ? 'active' : ''}`;
                navItem.dataset.id = category.id;

                // Content wrapper
                const infoWrapper = document.createElement("div");
                infoWrapper.className = "category-info";

                const iconSpan = document.createElement("span");
                iconSpan.className = "category-icon";
                iconSpan.innerHTML = category.icon;

                const titleSpan = document.createElement("span");
                titleSpan.textContent = category.title;

                infoWrapper.appendChild(iconSpan);
                infoWrapper.appendChild(titleSpan);

                // Badge for selected count
                const badge = document.createElement("span");
                badge.className = "badge";
                badge.id = `badge-${category.id}`;

                navItem.appendChild(infoWrapper);
                navItem.appendChild(badge);

                navItem.addEventListener("click", () => {
                    // Update active state in sidebar
                    document.querySelectorAll('.category-nav-item').forEach(el => el.classList.remove('active'));
                    navItem.classList.add('active');

                    // Render new category
                    activeCategoryId = category.id;
                    renderActiveCategory(activeCategoryId);
                });

                sidebarNav.appendChild(navItem);
            });

            updateBadges();
        }

        // Helper: Calculate suggestions based on ALL current selections
        function calculateSuggestions() {
            const newSuggestions = new Set();
            for (const catId in selectedTags) {
                if (catId === "suggested") continue;
                selectedTags[catId].forEach(tag => {
                    if (tagPairings[tag]) {
                        tagPairings[tag].forEach(sug => {
                            // Only suggest it if it's NOT already selected anywhere
                            let alreadySelected = false;
                            for (const checkCatId in selectedTags) {
                                if (selectedTags[checkCatId].has(sug)) {
                                    alreadySelected = true;
                                    break;
                                }
                            }
                            if (!alreadySelected) {
                                newSuggestions.add(sug);
                            }
                        });
                    }
                });
            }
            availableSuggestions = Array.from(newSuggestions);

            // Re-render suggestion count badge
            const badge = document.getElementById('badge-suggested');
            if (badge) {
                badge.textContent = availableSuggestions.length;
                if (availableSuggestions.length > 0) {
                    badge.classList.add('visible');
                } else {
                    badge.classList.remove('visible');
                }
            }
        }

        // Find which native category a tag belongs to
        function findCategoryForTag(targetTag) {
            for (const cat of libraryData) {
                if (cat.tags.includes(targetTag)) {
                    return cat.id;
                }
            }
            return null;
        }

        // Render Main Tags View for Active Category
        function renderActiveCategory(categoryId) {
            tagsContainer.innerHTML = "";

            if (categoryId === "suggested") {
                currentCategoryTitle.innerHTML = `<span style="color: var(--primary); display: flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path><circle cx="12" cy="12" r="4"></circle></svg></span> Smart Suggestions`;

                if (availableSuggestions.length === 0) {
                    tagsContainer.innerHTML = `<div style="color: var(--text-muted); padding: 1rem;">Select tags from the library to see smart suggestions here. Try selecting "Modern megachurch stage" or "Youth night concert".</div>`;
                    return;
                }

                availableSuggestions.forEach(tagText => {
                    const tagBtn = document.createElement("button");
                    tagBtn.className = "tag"; // Suggestions are not active yet
                    tagBtn.textContent = tagText;

                    tagBtn.addEventListener("click", () => {
                        // When clicked, add it to its NATIVE category so it flows into prompt logic properly
                        const nativeCatId = findCategoryForTag(tagText);
                        if (nativeCatId) {
                            selectedTags[nativeCatId].add(tagText);
                            calculateSuggestions(); // Recalculate
                            updateBadges();
                            updatePrompt();
                            renderActiveCategory("suggested"); // re-render self
                        }
                    });
                    tagsContainer.appendChild(tagBtn);
                });
                return;
            }

            // Normal category rendering
            const category = libraryData.find(c => c.id === categoryId);
            if (!category) return;

            // Update Header
            currentCategoryTitle.innerHTML = `<span style="color: var(--primary); display: flex;">${category.icon}</span> ${category.title}`;

            // Render Tags
            category.tags.forEach(tagText => {
                const tagBtn = document.createElement("button");
                tagBtn.className = `tag ${selectedTags[categoryId].has(tagText) ? 'active' : ''}`;
                tagBtn.textContent = tagText;

                tagBtn.addEventListener("click", () => {
                    if (selectedTags[categoryId].has(tagText)) {
                        selectedTags[categoryId].delete(tagText);
                        tagBtn.classList.remove("active");
                    } else {
                        selectedTags[categoryId].add(tagText);
                        tagBtn.classList.add("active");
                    }
                    calculateSuggestions(); // Recalculate suggestions based on new state
                    updateBadges();
                    updatePrompt();
                });

                tagsContainer.appendChild(tagBtn);
            });
        }

        // Update Sidebar Badges
        function updateBadges() {
            libraryData.forEach(cat => {
                const count = selectedTags[cat.id].size;
                const badge = document.getElementById(`badge-${cat.id}`);
                if (badge) {
                    badge.textContent = count;
                    if (count > 0) {
                        badge.classList.add('visible');
                    } else {
                        badge.classList.remove('visible');
                    }
                }
            });
        }

        // Update Final Prompt Output
        function updatePrompt() {
            const getStr = (catId) => selectedTags[catId] ? Array.from(selectedTags[catId]).join(", ") : "";

            const mediaTypeStr = getStr("media_type");
            const seasonsStr = getStr("seasons_holidays");
            const baseStr = basePromptInput.value.trim();
            const subjectsStr = getStr("subjects_people");
            const stageStr = getStr("stage_lighting");
            const atmosphereStr = getStr("atmosphere_vibe");
            const typographyStr = getStr("typography_integration");
            const colorsStr = getStr("colors_tones");

            const promptParts = [];

            // Logical assembly order for Church Media Edition
            if (mediaTypeStr) promptParts.push(mediaTypeStr);
            if (seasonsStr) promptParts.push(seasonsStr);
            if (baseStr) promptParts.push(baseStr);
            if (subjectsStr) promptParts.push("featuring " + subjectsStr);
            if (stageStr) promptParts.push(stageStr);
            if (atmosphereStr) promptParts.push("with a " + atmosphereStr + " atmosphere");
            if (typographyStr) promptParts.push("incorporating " + typographyStr);
            if (colorsStr) promptParts.push("with " + colorsStr + " tones");

            let finalString = promptParts.join(", ");

            if (!finalString) {
                finalOutput.textContent = "Your generated prompt will dynamically appear here...";
                finalOutput.style.color = "var(--text-muted)";
            } else {
                finalOutput.textContent = finalString;
                finalOutput.style.color = "#c4b5fd"; // Bright highlight color
            }
        }

        // Event Listeners
        basePromptInput.addEventListener("input", updatePrompt);

        btnClear.addEventListener("click", () => {
            basePromptInput.value = "";
            for (let key in selectedTags) {
                selectedTags[key].clear();
            }
            calculateSuggestions();
            renderActiveCategory(activeCategoryId); // Re-render to clear visual tags
            updateBadges();
            updatePrompt();
        });

        // Randomizer (Surprise Me) Magic Button
        btnRandom.addEventListener("click", () => {
            // Clear existing first
            for (let key in selectedTags) { selectedTags[key].clear(); }

            // Randomly select 1 tag from 4-6 random categories
            const shuffledCategories = [...libraryData].sort(() => 0.5 - Math.random());
            const numCategoriesToPick = Math.floor(Math.random() * 3) + 4; // pick 4 to 6 categories

            for (let i = 0; i < numCategoriesToPick; i++) {
                const cat = shuffledCategories[i];
                if (cat.tags.length > 0) {
                    const randomTag = cat.tags[Math.floor(Math.random() * cat.tags.length)];
                    selectedTags[cat.id].add(randomTag);
                }
            }

            // Re-render current view if tags were added to it
            renderActiveCategory(activeCategoryId);
            updateBadges();
            updatePrompt();
        });

        btnCopy.addEventListener("click", async () => {
            const textToCopy = finalOutput.textContent;
            if (textToCopy && textToCopy !== "Your generated prompt will dynamically appear here...") {
                try {
                    await navigator.clipboard.writeText(textToCopy);
                    const originalText = btnCopy.innerHTML;
                    btnCopy.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!';
                    setTimeout(() => { btnCopy.innerHTML = originalText; }, 2000);
                } catch (err) {
                    alert("Failed to copy text.");
                }
            }
        });

        // Run
        initApp();
    </script>
</body>
</html>
