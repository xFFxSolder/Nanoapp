<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Banana 2 - Super Master Prompt Builder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #8b5cf6; /* Vibrant Purple */
            --primary-hover: #7c3aed;
            --secondary: #3b82f6; /* Glowing Blue */
            --bg: #09090b; /* Zinc 950 - deeper dark */
            --surface: rgba(24, 24, 27, 0.7); /* Zinc 900 semi-transparent */
            --surface-hover: rgba(39, 39, 42, 0.9); /* Zinc 800 */
            --surface-active: rgba(63, 63, 70, 0.9); /* Zinc 700 */
            --text-main: #fafafa; /* Zinc 50 */
            --text-muted: #a1a1aa; /* Zinc 400 */
            --border: rgba(63, 63, 70, 0.5); /* Zinc 700 */
            --radius: 16px;
            --sidebar-width: 320px;

            /* Neon Tag Accents */
            --tag-glow: rgba(139, 92, 246, 0.2);
            --tag-text: #c4b5fd;

            --glow-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            box-shadow: var(--glass-shadow);
        }

        /* Top Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #c4b5fd, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Main Dashboard Layout */
        .dashboard {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            padding-bottom: 110px; /* Space for sticky footer */
        }

        /* Left Sidebar: Categories Menu */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 1.5rem 1rem;
            gap: 0.5rem;
        }

        /* Hide scrollbar for sidebar */
        .sidebar::-webkit-scrollbar { width: 0px; }

        .category-nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
            border: 1px solid transparent;
            font-weight: 500;
        }

        .category-nav-item:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .category-nav-item.active {
            background: var(--surface-active);
            color: var(--text-main);
            border-color: var(--border);
            box-shadow: inset 2px 0 0 var(--primary);
        }

        .category-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .category-icon {
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
        }

        .badge {
            background: var(--primary);
            color: white;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 99px;
            font-weight: 700;
            display: none; /* Hidden by default, shown via JS when count > 0 */
        }

        .badge.visible {
            display: inline-block;
        }

        /* Main Content Area (Right Side) */
        .workspace {
            flex: 1;
            padding: 2rem 3rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Base Subject Input Panel */
        .subject-panel {
            border-radius: var(--radius);
            padding: 1.5rem;
        }

        .subject-panel h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .subject-panel p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: rgba(9, 9, 11, 0.5); /* Darker input */
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        /* Dynamic Category View Panel */
        .tags-view-panel {
            flex: 1;
        }

        .tags-header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .tags-header h2 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .tag {
            padding: 0.6rem 1.2rem;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            background-color: rgba(24, 24, 27, 0.4);
            color: var(--text-muted);
            backdrop-filter: blur(4px);
        }

        .tag:hover {
            transform: translateY(-2px);
            color: var(--text-main);
            border-color: var(--text-muted);
            background-color: var(--surface-hover);
        }

        .tag:active {
            transform: translateY(0);
        }

        .tag.active {
            background-color: var(--tag-glow);
            color: var(--tag-text);
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--tag-glow);
        }

        /* Sticky Footer */
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 1rem 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-sizing: border-box;
        }

        .footer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-header h3 {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
        }

        .output-box {
            background-color: rgba(9, 9, 11, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            font-size: 1.05rem;
            min-height: 24px;
            max-height: 80px;
            overflow-y: auto;
            word-wrap: break-word;
            line-height: 1.5;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            filter: brightness(1.1);
            box-shadow: var(--glow-shadow);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--surface-hover);
            border-color: var(--text-muted);
            box-shadow: none;
        }

        .btn-magic {
            background: linear-gradient(135deg, #f59e0b, #ef4444); /* Orange/Red gradient */
        }

        /* Responsive */
        @media (max-width: 900px) {
            .dashboard {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: 100%;
                height: 200px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .workspace {
                padding: 1.5rem;
            }
        }

        /* Icons (SVG injected via JS for neatness, but CSS styles here) */
        svg {
            display: block;
        }
    </style>
</head>

                icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>',
                tags: ["Monochromatic", "Duotone", "Pastel tones", "Vibrant colors", "Dark and moody", "High contrast", "Desaturated", "Sepia", "Neon synthwave", "Earthy tones", "Holographic", "Iridescent", "Ethereal", "Melancholic vibe", "Joyful atmosphere", "Ominous feeling", "Cinematic teal and orange", "Cyberpunk neon palette", "Muted autumn colors", "Vaporwave aesthetics", "Gothic darkness", "Heavenly glow"]
            }
        ];

        // Smart Suggestions Data (Tag to Array of suggested Tags)
        const tagPairings = {
            "Modern megachurch stage": ["Moving head concert lights", "Atmospheric haze", "LED screen pixels", "Dynamic beam lights"],
            "Worship band": ["Arena concert stage", "Laser light show", "Volumetric lighting", "High-tech auditorium"],
            "Youth night concert": ["Neon tube lettering", "Cyberpunk neon palette", "Distressed youth font", "Laser light show", "Fog machine smoke"],
            "Hillsong worship style": ["Cinematic lighting", "Washed stage lighting", "Modern worship typography", "Atmospheric haze", "Lens flare"],
            "Elevation worship background": ["LED screen pixels", "Monochromatic", "Volumetric lighting", "Minimalist layout"],
            "Passion Conference aesthetic": ["Arena concert stage", "Moving head concert lights", "Laser light show", "Dynamic beam lights", "Atmospheric haze"],
            "Cyberpunk cityscape": ["Neon glow", "Rainy cyberpunk city", "Glowing neon tubes", "Cyberpunk neon palette", "Cyberpunk hacker"],
            "Worship background": ["Worship lyrics background", "Modern worship typography", "Cinematic teal and orange", "Golden hour"],
            "Stained glass window": ["God rays", "Gothic cathedral", "Traditional church altar", "Volumetric lighting"]
        };

        // State Tracking
        const selectedTags = {};
        libraryData.forEach(cat => selectedTags[cat.id] = new Set());
        // Add pseudo-category for suggestions
        selectedTags["suggested"] = new Set();
        let activeCategoryId = "suggested"; // Default to suggestions category

        // Derived state for suggestions
        let availableSuggestions = [];

        // DOM Elements
        const sidebarNav = document.getElementById("sidebar-nav");
        const basePromptInput = document.getElementById("base-prompt");
        const finalOutput = document.getElementById("final-output");
        const tagsContainer = document.getElementById("tags-container");
        const currentCategoryTitle = document.getElementById("current-category-title");

        const btnCopy = document.getElementById("btn-copy");
        const btnClear = document.getElementById("btn-clear");
        const btnRandom = document.getElementById("btn-random");

        // Initialization
        function initApp() {
            renderSidebar();
            renderActiveCategory(activeCategoryId);
            updatePrompt();
        }

        // Render Sidebar Navigation
        function renderSidebar() {
            sidebarNav.innerHTML = ""; // Clear existing

            // Add Smart Suggestions pseudo-category first
            const suggestionNavItem = document.createElement("div");
            suggestionNavItem.className = `category-nav-item ${'suggested' === activeCategoryId ? 'active' : ''}`;
            suggestionNavItem.dataset.id = "suggested";

            const sugInfoWrapper = document.createElement("div");
            sugInfoWrapper.className = "category-info";

            const sugIconSpan = document.createElement("span");
            sugIconSpan.className = "category-icon";
            sugIconSpan.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path><circle cx="12" cy="12" r="4"></circle></svg>';
            sugIconSpan.style.color = "var(--primary)"; // Special color for suggestions

            const sugTitleSpan = document.createElement("span");
            sugTitleSpan.textContent = "Smart Suggestions";
            sugTitleSpan.style.color = "var(--primary)"; // Special color

            sugInfoWrapper.appendChild(sugIconSpan);
            sugInfoWrapper.appendChild(sugTitleSpan);

            const sugBadge = document.createElement("span");
            sugBadge.className = "badge";
            sugBadge.id = "badge-suggested";
            sugBadge.textContent = availableSuggestions.length;
            if (availableSuggestions.length > 0) sugBadge.classList.add('visible');

            suggestionNavItem.appendChild(sugInfoWrapper);
            suggestionNavItem.appendChild(sugBadge);

            suggestionNavItem.addEventListener("click", () => {
                document.querySelectorAll('.category-nav-item').forEach(el => el.classList.remove('active'));
                suggestionNavItem.classList.add('active');
                activeCategoryId = "suggested";
                renderActiveCategory("suggested");
            });

            sidebarNav.appendChild(suggestionNavItem);

            // Render normal categories
            libraryData.forEach(category => {
                const navItem = document.createElement("div");
                navItem.className = `category-nav-item ${category.id === activeCategoryId ? 'active' : ''}`;
                navItem.dataset.id = category.id;

                // Content wrapper
                const infoWrapper = document.createElement("div");
                infoWrapper.className = "category-info";

                const iconSpan = document.createElement("span");
                iconSpan.className = "category-icon";
                iconSpan.innerHTML = category.icon;

                const titleSpan = document.createElement("span");
                titleSpan.textContent = category.title;

                infoWrapper.appendChild(iconSpan);
                infoWrapper.appendChild(titleSpan);

                // Badge for selected count
                const badge = document.createElement("span");
                badge.className = "badge";
                badge.id = `badge-${category.id}`;

                navItem.appendChild(infoWrapper);
                navItem.appendChild(badge);

                navItem.addEventListener("click", () => {
                    // Update active state in sidebar
                    document.querySelectorAll('.category-nav-item').forEach(el => el.classList.remove('active'));
                    navItem.classList.add('active');

                    // Render new category
                    activeCategoryId = category.id;
                    renderActiveCategory(activeCategoryId);
                });

                sidebarNav.appendChild(navItem);
            });

            updateBadges();
        }

        // Helper: Calculate suggestions based on ALL current selections
        function calculateSuggestions() {
            const newSuggestions = new Set();
            for (const catId in selectedTags) {
                if (catId === "suggested") continue;
                selectedTags[catId].forEach(tag => {
                    if (tagPairings[tag]) {
                        tagPairings[tag].forEach(sug => {
                            // Only suggest it if it's NOT already selected anywhere
                            let alreadySelected = false;
                            for (const checkCatId in selectedTags) {
                                if (selectedTags[checkCatId].has(sug)) {
                                    alreadySelected = true;
                                    break;
                                }
                            }
                            if (!alreadySelected) {
                                newSuggestions.add(sug);
                            }
                        });
                    }
                });
            }
            availableSuggestions = Array.from(newSuggestions);

            // Re-render suggestion count badge
            const badge = document.getElementById('badge-suggested');
            if (badge) {
                badge.textContent = availableSuggestions.length;
                if (availableSuggestions.length > 0) {
                    badge.classList.add('visible');
                } else {
                    badge.classList.remove('visible');
                }
            }
        }

        // Find which native category a tag belongs to
        function findCategoryForTag(targetTag) {
            for (const cat of libraryData) {
                if (cat.tags.includes(targetTag)) {
                    return cat.id;
                }
            }
            return null;
        }

        // Render Main Tags View for Active Category
        function renderActiveCategory(categoryId) {
            tagsContainer.innerHTML = "";

            if (categoryId === "suggested") {
                currentCategoryTitle.innerHTML = `<span style="color: var(--primary); display: flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path><circle cx="12" cy="12" r="4"></circle></svg></span> Smart Suggestions`;

                if (availableSuggestions.length === 0) {
                    tagsContainer.innerHTML = `<div style="color: var(--text-muted); padding: 1rem;">Select tags from the library to see smart suggestions here. Try selecting "Modern megachurch stage" or "Youth night concert".</div>`;
                    return;
                }

                availableSuggestions.forEach(tagText => {
                    const tagBtn = document.createElement("button");
                    tagBtn.className = "tag"; // Suggestions are not active yet
                    tagBtn.textContent = tagText;

                    tagBtn.addEventListener("click", () => {
                        // When clicked, add it to its NATIVE category so it flows into prompt logic properly
                        const nativeCatId = findCategoryForTag(tagText);
                        if (nativeCatId) {
                            selectedTags[nativeCatId].add(tagText);
                            calculateSuggestions(); // Recalculate
                            updateBadges();
                            updatePrompt();
                            renderActiveCategory("suggested"); // re-render self
                        }
                    });
                    tagsContainer.appendChild(tagBtn);
                });
                return;
            }

            // Normal category rendering
            const category = libraryData.find(c => c.id === categoryId);
            if (!category) return;

            // Update Header
            currentCategoryTitle.innerHTML = `<span style="color: var(--primary); display: flex;">${category.icon}</span> ${category.title}`;

            // Render Tags
            category.tags.forEach(tagText => {
                const tagBtn = document.createElement("button");
                tagBtn.className = `tag ${selectedTags[categoryId].has(tagText) ? 'active' : ''}`;
                tagBtn.textContent = tagText;

                tagBtn.addEventListener("click", () => {
                    if (selectedTags[categoryId].has(tagText)) {
                        selectedTags[categoryId].delete(tagText);
                        tagBtn.classList.remove("active");
                    } else {
                        selectedTags[categoryId].add(tagText);
                        tagBtn.classList.add("active");
                    }
                    calculateSuggestions(); // Recalculate suggestions based on new state
                    updateBadges();
                    updatePrompt();
                });

                tagsContainer.appendChild(tagBtn);
            });
        }

        // Update Sidebar Badges
        function updateBadges() {
            libraryData.forEach(cat => {
                const count = selectedTags[cat.id].size;
                const badge = document.getElementById(`badge-${cat.id}`);
                if (badge) {
                    badge.textContent = count;
                    if (count > 0) {
                        badge.classList.add('visible');
                    } else {
                        badge.classList.remove('visible');
                    }
                }
            });
        }

        // Update Final Prompt Output
        function updatePrompt() {
            const getStr = (catId) => selectedTags[catId] ? Array.from(selectedTags[catId]).join(", ") : "";

            const formatStr = [getStr("format"), getStr("church")].filter(Boolean).join(", ");
            const baseStr = basePromptInput.value.trim();
            const charactersStr = getStr("characters");
            const environmentStr = [getStr("environment"), getStr("architecture")].filter(Boolean).join(", ");
            const styleMediumStr = [getStr("photography"), getStr("digital_art"), getStr("anime"), getStr("art_movements")].filter(Boolean).join(", ");
            const typographyStr = getStr("typography");
            const engineStr = getStr("engine");
            const materialsStr = getStr("materials");
            const lightingStr = getStr("lighting");
            const cameraStr = getStr("camera");
            const colorStr = getStr("color");

            const promptParts = [];

            // Logical assembly order for Nano Banana 2
            if (formatStr) promptParts.push(formatStr);
            if (baseStr) promptParts.push(baseStr);
            if (charactersStr) promptParts.push("featuring " + charactersStr);
            if (environmentStr) promptParts.push("set in " + environmentStr);
            if (styleMediumStr) promptParts.push("in the style of " + styleMediumStr);
            if (typographyStr) promptParts.push("with " + typographyStr);
            if (materialsStr) promptParts.push("featuring " + materialsStr + " textures");
            if (engineStr) promptParts.push("rendered in " + engineStr);
            if (cameraStr) promptParts.push("shot with " + cameraStr);
            if (lightingStr) promptParts.push("illuminated by " + lightingStr);
            if (colorStr) promptParts.push("with " + colorStr + " aesthetics");

            let finalString = promptParts.join(", ");

            if (!finalString) {
                finalOutput.textContent = "Your generated prompt will dynamically appear here...";
                finalOutput.style.color = "var(--text-muted)";
            } else {
                finalOutput.textContent = finalString;
                finalOutput.style.color = "#c4b5fd"; // Bright highlight color
            }
        }

        // Event Listeners
        basePromptInput.addEventListener("input", updatePrompt);

        btnClear.addEventListener("click", () => {
            basePromptInput.value = "";
            for (let key in selectedTags) {
                selectedTags[key].clear();
            }
            calculateSuggestions();
            renderActiveCategory(activeCategoryId); // Re-render to clear visual tags
            updateBadges();
            updatePrompt();
        });

        // Randomizer (Surprise Me) Magic Button
        btnRandom.addEventListener("click", () => {
            // Clear existing first
            for (let key in selectedTags) { selectedTags[key].clear(); }

            // Randomly select 1 tag from 4-6 random categories
            const shuffledCategories = [...libraryData].sort(() => 0.5 - Math.random());
            const numCategoriesToPick = Math.floor(Math.random() * 3) + 4; // pick 4 to 6 categories

            for (let i = 0; i < numCategoriesToPick; i++) {
                const cat = shuffledCategories[i];
                if (cat.tags.length > 0) {
                    const randomTag = cat.tags[Math.floor(Math.random() * cat.tags.length)];
                    selectedTags[cat.id].add(randomTag);
                }
            }

            // Re-render current view if tags were added to it
            renderActiveCategory(activeCategoryId);
            updateBadges();
            updatePrompt();
        });

        btnCopy.addEventListener("click", async () => {
            const textToCopy = finalOutput.textContent;
            if (textToCopy && textToCopy !== "Your generated prompt will dynamically appear here...") {
                try {
                    await navigator.clipboard.writeText(textToCopy);
                    const originalText = btnCopy.innerHTML;
                    btnCopy.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!';
                    setTimeout(() => { btnCopy.innerHTML = originalText; }, 2000);
                } catch (err) {
                    alert("Failed to copy text.");
                }
            }
        });

        // Run
        initApp();
    </script>
</body>
</html>
